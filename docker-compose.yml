version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: blogging_db
    restart: always
    environment:
      MYSQL_DATABASE: blogging_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: blogging_app
    ports:
      - "8080:8080"
    depends_on:
      - db
    network_mode: "host"  # This allows 'localhost' to work inside the container

volumes:
  db_data:
