spring.datasource.url=${BLOG_DEMO_JDBC_URL:jdbc:mysql://localhost:3307/blogging_elk_demo?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${BLOG_DEMO_DB_USERNAME:blogging_demo}
spring.datasource.password=${BLOG_DEMO_DB_PASSWORD:blogging-demo-local-only}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.devtools.add-properties=false

logging.file.name=logs/blog-app.json
logging.structured.format.file=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.environment=local-elk
logging.structured.json.exclude=message,process
logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.techm.samples=INFO