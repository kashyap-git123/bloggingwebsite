spring.application.name=BloggingWebsite

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/blogging_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root


# Hibernate Properties 
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# Show SQL Queries in Console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


logging.level.org.springframework.security=DEBUG

logging.level.org.techm.samples=DEBUG
logging.file.name=logs/blog-app.log
