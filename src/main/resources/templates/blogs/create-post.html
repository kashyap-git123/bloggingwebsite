<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Create Post</title>
<link rel="stylesheet" th:href="@{/css/blogger.css}">
<link rel="stylesheet" th:href="@{/css/create-post.css}">
</head>
<body>
<div th:replace="/blogs/blogger-layout :: layout(content=~{::content}, pageTitle='Dashboard')">
    <div th:fragment="content">
    <h2>Create a New Post</h2>
    <form class="create-post-form"  th:action="@{/posts/create}" th:object="${post}" method="post">
        <label>Title:</label>
        <input type="text" th:field="*{title}" required><br>

        <label>Content:</label><br>
        <textarea th:field="*{content}" rows="5" cols="40" required></textarea><br>

        <label>Status:</label>
        <select th:field="*{status}">
            <option value="PUBLISHED">Published</option>
            <option value="DRAFT">Draft</option>
        </select><br>

        <button type="submit">Submit Post</button>
    </form>
    
    </div>
    </div>
    <div class="back-link" style="margin-top: 30px;">
        <th:block th:if="${#authorization.expression('hasRole(''BLOGGER'')')}">
        
        
            <a th:href="@{/blog/users/blogger/dashboard}"><button class="back-dashboard-button">🔙 Back to Blogger Dashboard</button></a>
        </th:block>
    </div>
</body>
</html>
