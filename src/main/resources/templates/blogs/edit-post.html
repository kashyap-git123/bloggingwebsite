 <!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Post</title>
    <link rel="stylesheet" th:href="@{/css/blogger.css}">
    <link rel="stylesheet" th:href="@{/css/create-post.css}">
</head>
<body>
<div th:replace="/blogs/blogger-layout :: layout(content=~{::content}, pageTitle='Edit Post')">
    <div th:fragment="content">
        <h2>Edit Post</h2>
        <form class="create-post-form" th:action="@{'/posts/edit/' + ${post.id}}" th:object="${post}" method="post">
            <label>Title:</label>
            <input type="text" th:field="*{title}" required><br>

            <label>Content:</label><br>
            <textarea th:field="*{content}" rows="5" cols="40" required></textarea><br>

            <!-- <label>Status:</label>
            <select th:field="*{status}">
                <option value="PUBLISHED">Published</option>
                <option value="DRAFT">Draft</option>
            </select><br> -->

            <button type="submit">Update</button>
        </form>
    </div>
</div>
</body>
</html>
