<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Blogger Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/blogger.css}">
</head>
<body>

<div th:replace="/blogs/blogger-layout :: layout(content=~{::content}, pageTitle='📘 Blogger Dashboard')">

    <div th:fragment="content" class="center-wrapper">
        <h2>👋 Welcome, Blogger!</h2>
        <p>Use the options below to manage your posts:</p>

        <ul class="dashboard-links">
            <li><a th:href="@{/posts/create}">✍️ Create Post</a></li>
            <li><a th:href="@{/posts/mine}">📚 My Posts</a></li>
            <li><a th:href="@{/posts/drafts}">📝 Drafts</a></li>
        </ul>
    </div>

</div>

</body>
</html>
